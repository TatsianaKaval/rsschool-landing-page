<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee House</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrapper">
    <header class="header">
      <div class="container header-container">
        <div class="logo">
          <a href="#"><img src="assets/img/logo/logo.svg" class="logo-light" alt="logo light" width="100" height="60"></a>
        </div>
        <div class="header-nav">
          <ul class="header-nav-list">
            <li class="header-nav-item">
              <a class="header-nav-link link" href="#favorite">Favorite coffee</a>
            </li>
            <li class="header-nav-item">
              <a class="header-nav-link link" href="#about">About</a>
            </li>
            <li class="header-nav-item">
              <a class="header-nav-link link" href="#app">Mobile app</a>
            </li>
            <li class="header-nav-item">
              <a class="header-nav-link link" href="#contact">Contact us</a>
            </li>
          </ul>
        </div>
        <div class="header-menu">
          <button class="theme-toggle" id="themeToggle" aria-label="Change the screen theme">
            <img class="sun" src="assets/icons/Sun.svg" alt="light">
            <img class="moon" src="assets/icons/Moon.svg" alt="dark">
          </button>
          <button class="menu-burger link" aria-label="Open the menu">
            Menu
            <img src="assets/icons/coffee-cup.svg" alt="coffee-menu">
          </button>
        </div>
      </div>

    </header>

    <main class="main">
      <div class="container">

      </div>

    </main>

    <footer class="footer">
      <div class="container">

      </div>

    </footer>
  </div>
</body>
</html>
